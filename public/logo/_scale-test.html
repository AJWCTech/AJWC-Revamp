<!doctype html>
<meta charset="utf-8">
<title>Mark scale test</title>
<style>
  body { background:#05070A; color:#8B97A6; font:14px system-ui; padding:28px; }
  h2 { color:#F2F5F8; font-weight:500; font-size:15px; margin:26px 0 12px; }
  .row { display:flex; align-items:flex-end; gap:26px; }
  figure { margin:0; text-align:center; }
  figcaption { margin-top:8px; font-size:11px; }
  .brand { color:#20C2D2; }
  .onbrand { background:#20C2D2; padding:12px; border-radius:6px; }
  .onbrand figcaption { color:#05070A; }
</style>

<h2>Full mark — is it an aperture now, and does the centre stay open?</h2>
<div class="row">
  <figure><img src="ajwc-mark.svg" width="220"><figcaption>220</figcaption></figure>
  <figure><img src="ajwc-mark.svg" width="96"><figcaption>96</figcaption></figure>
  <figure><img src="ajwc-mark.svg" width="48"><figcaption>48</figcaption></figure>
  <figure><img src="ajwc-mark.svg" width="32"><figcaption>32</figcaption></figure>
  <figure><img src="ajwc-mark.svg" width="16"><figcaption>16 — expect mush</figcaption></figure>
</div>

<h2>Simplified mark — the one that ships as the small favicon</h2>
<div class="row">
  <figure><img src="ajwc-mark-16.svg" width="96"><figcaption>96</figcaption></figure>
  <figure><img src="ajwc-mark-16.svg" width="32"><figcaption>32</figcaption></figure>
  <figure><img src="ajwc-mark-16.svg" width="16"><figcaption>16</figcaption></figure>
</div>

  <figure class="onbrand"><img src="ajwc-mark-knockout.svg" width="80"><figcaption>knockout</figcaption></figure>
</div>
